name: Build and release

# 普通推送和 PR 生成可下载的构建产物，匹配版本的标签推送才发布 Release。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  # 构建阶段仅需读取代码；写 Release 的权限单独授予发布 job。
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # 使用同架构 runner 构建 musl 程序，避免交叉编译器和 QEMU 带来的差异。
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      RUST_TOOLCHAIN: 1.96.0
      RUST_TARGET: ${{ matrix.target }}
      PACKAGE_ARCH: ${{ matrix.arch }}
      RELEASE_TAG: ${{ github.ref_name }}
      CARGO_INCREMENTAL: 0
      CC: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v7
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "Tag $RELEASE_TAG does not match Cargo.toml version $expected" >&2
            exit 1
          fi
      # 固定 Rust 版本，锁定依赖；静态 musl 包降低对目标机器动态库的要求。
      - name: Install native musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --target "$RUST_TARGET"
          rustup default "$RUST_TOOLCHAIN"
      - name: Check sources and installer
        run: |
          cargo fmt --all -- --check
          python3 scripts/verify_sources.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          sh -n install.sh
          sh -n deploy/install.sh
          sh -n scripts/package.sh
      - name: Test
        run: cargo test --locked --target "$RUST_TARGET"
      - name: Build release binary
        run: cargo build --release --locked --target "$RUST_TARGET"
      - name: Package and smoke-test CLI
        run: sh scripts/package.sh "$RUST_TARGET" "$PACKAGE_ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: agent-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # 两种架构都完成测试和打包后才进入发布步骤，避免缺少某个架构的 Release。
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: agent-linux-*
          merge-multiple: true
          path: dist
      - name: Prepare release assets
        run: |
          cp install.sh dist/install.sh
          cd dist
          sha256sum agent-*.tar.gz install.sh > SHA256SUMS
      # 首次发布先建草稿，上传全部文件后再公开，减少安装器读到不完整资源的窗口。
      - name: Upload assets and publish
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/install.sh dist/SHA256SUMS --clobber
          version_without_build=${RELEASE_TAG%%+*}
          if [[ "$version_without_build" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
