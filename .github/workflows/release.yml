name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the project SSH-signed stable version tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=deploy/release-allowed-signers verify-tag "$GITHUB_REF_NAME"

  build:
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
        with:
          package_json_file: web/package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-release-${{ matrix.target }}-1.96-${{ hashFiles('Cargo.lock') }}
      - name: Complete checks and native standalone smoke
        run: sh scripts/check.sh
      - name: Build static Linux release after the embedded web build
        env:
          PANEL_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add "$PANEL_TARGET"
          panel_cc_name="CC_${PANEL_TARGET//-/_}"
          panel_linker_name="CARGO_TARGET_${PANEL_TARGET^^}_LINKER"
          panel_linker_name=${panel_linker_name//-/_}
          env "$panel_cc_name=musl-gcc" "$panel_linker_name=musl-gcc" cargo build --workspace --release --locked --target "$PANEL_TARGET"
          for panel_binary in panel-server panel-agent panel-installer; do
            if readelf -l "target/$PANEL_TARGET/release/$panel_binary" | grep -q INTERP; then
              echo 'Dynamic ELF interpreter unexpectedly present' >&2
              exit 1
            fi
          done
      - name: Package and exercise real installer with rollback and TTY
        env:
          PANEL_TARGET: ${{ matrix.target }}
          PANEL_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          panel_version=${GITHUB_REF_NAME#v}
          test "$("target/$PANEL_TARGET/release/panel-installer" --version)" = "panel-installer $panel_version"
          panel_test_dir=$(mktemp -d /tmp/panel-release.XXXXXXXX)
          mkdir "$panel_test_dir/failure-binaries"
          cc -O2 crates/installer/tests/fixtures/failing-release.c -o "$panel_test_dir/failure-binaries/panel-server"
          cp "$panel_test_dir/failure-binaries/panel-server" "$panel_test_dir/failure-binaries/panel-agent"
          cp "$panel_test_dir/failure-binaries/panel-server" "$panel_test_dir/failure-binaries/panel-installer"
          python3 scripts/package.py --binaries "target/$PANEL_TARGET/release" --output "$panel_test_dir/bundle" --arch "$PANEL_ARCH" --version "$panel_version"
          python3 scripts/package.py --binaries "$panel_test_dir/failure-binaries" --output "$panel_test_dir/failure" --arch "$PANEL_ARCH" --version 0.1.1
          panel_hash=$(sha256sum "$panel_test_dir/bundle/bundle.json" | cut -d ' ' -f 1)
          panel_failure_hash=$(sha256sum "$panel_test_dir/failure/bundle.json" | cut -d ' ' -f 1)
          mkdir -p dist
          tar -C "$panel_test_dir/bundle" -czf "dist/panel-linux-$PANEL_ARCH-$GITHUB_REF_NAME.tar.gz" bundle.json panel-agent panel-installer panel-server
          # Hosted runners grant the runner write access here; the disposable test
          # VM must enforce the same root-owned ancestors required in production.
          sudo chown root:root /usr/local /usr/local/bin
          sudo chmod go-w /usr/local /usr/local/bin
          sudo chown -R root:root "$panel_test_dir"
          sudo chmod 700 "$panel_test_dir"
          sudo python3 scripts/verify-install.py --bundle "$panel_test_dir/bundle" --sha256 "$panel_hash" --failure-bundle "$panel_test_dir/failure" --failure-sha256 "$panel_failure_hash" --wizard --backup-restore
          sudo python3 scripts/verify-bootstrap.py --bundle "$panel_test_dir/bundle" --bootstrap "$PWD/scripts/bootstrap.sh" --owned-vm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 5

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
        with:
          cosign-release: v3.1.4
      - name: Sign authenticated checksum manifest with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/bootstrap.sh dist/bootstrap.sh
          cp deploy/systemd/*.service deploy/systemd/*.socket dist/
          cp deploy/release-tag-key.pub dist/
          cp docs/release.md dist/VERIFICATION.md
          (cd dist && sha256sum ./* > SHA256SUMS)
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          cosign verify-blob --bundle dist/SHA256SUMS.sigstore.json --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME" --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/SHA256SUMS
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Linux Panel $GITHUB_REF_NAME" --notes-file docs/release-notes.md
