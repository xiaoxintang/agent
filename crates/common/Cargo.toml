[package]
name = "panel-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
xray-stats = ["dep:tonic", "dep:tonic-prost", "dep:prost"]

[dependencies]
serde.workspace = true
ts-rs.workspace = true
serde_json.workspace = true
uuid.workspace = true
time.workspace = true
base64 = "=0.22.1"
sha2.workspace = true
hex.workspace = true
tokio.workspace = true

tonic = { version = "=0.14.9", default-features = false, features = ["channel", "codegen"], optional = true }
tonic-prost = { version = "=0.14.9", optional = true }
prost = { version = "=0.14.4", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process"] }

[lints]
workspace = true
