[package]
name = "panel-installer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
panel-common.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "=3.27.0"
dialoguer = "=0.12.0"
url = "=2.5.8"
flate2 = "=1.1.10"
tar = { version = "=0.4.46", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process", "net"] }

[dev-dependencies]
panel-common = { workspace = true, features = ["xray-stats"] }

[lints]
workspace = true
