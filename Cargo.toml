[workspace]
members = ["crates/common", "crates/server", "crates/agent", "crates/installer"]
resolver = "3"

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
panel-common = { path = "crates/common" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
clap = { version = "=4.6.7", features = ["derive"] }
rust-embed = { version = "=8.13.0", features = ["debug-embed"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "process", "io-util"] }
ts-rs = "=12.0.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate"] }
uuid = { version = "=1.29.0", features = ["v4"] }
sha2 = "=0.11.1"
hex = "=0.4.3"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "debuginfo"

# Rust 1.96/macOS can produce invalid stripped proc-macro dylibs.
[profile.release.build-override]
strip = "none"
